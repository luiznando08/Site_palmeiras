<html lang="PT-br">
<head>
    <title>Document</title>
    <link rel="stylesheet" href="../css/popup.css">
    <link rel="stylesheet" href="../css/estilo.css">
</head>
<body>
    <div>
        <main>
            <h1 id="nome-produto" class="titulo"></h1>
            <div class="slider">
                <button class="botao botao1" id="prevBtn">&#10094</button>
                <img class="camisas"  id="slider-img" src="">
                <button class="botao botao2" id="nextBtn">&#10095</button>

            </div>
            
            
            <img id="img-produto"  src="" class="imagem" >
            <p id="desc-produto" class="descricao"></p>

            <!--captura as informaçoes do parametro-->
            <script>
                //funçao para capturar os parametros
                function getParametro(infoCapturar){
                    urlparametro=new URLSearchParams(window.location.search);
                    return urlparametro.get(infoCapturar)
                }

                //preenche as informaçoes no layout
                document.getElementById("nome-produto").textContent = getParametro("nomeProduto");
                //document.getElementById("img-produto").src = getParametro("imgProduto");
                document.getElementById("desc-produto").textContent = getParametro("descProduto");

                //codigo slider
                const imagens=getParametro("imgProduto")
                             ? getParametro("imgProduto").split(',')
                             : [];
                let index = 0;
                //guarda o elemento da imagem
                const sliderImg=document.getElementById("slider-img")

                function mostrarImagem(){
                    if(imagens.length > 0){
                        sliderImg.src=imagens[index];
                    }
                    console.log(imagens)
                    console.log(index)
                           
                }

                document.getElementById("prevBtn").onclick = function(){
                    index = (index-1 + imagens.length) % imagens.length;
                    mostrarImagem()
                }

                document.getElementById("nextBtn").onclick = function(){
                    index = (index+1) % imagens.length;
                    mostrarImagem()

                }
                //exibe a primeira imagem
                mostrarImagem()

            </script>
        </main>
    </div>
</body>
</html>
